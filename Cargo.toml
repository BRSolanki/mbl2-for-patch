[package]
name = "mtbinloader2"
version = "0.1.12"
edition = "2021"

[dependencies]
android_logger = { version = "0.15.0", default-features = false }
atoi = "2.0.0"
bhook = { version = "0.1.2", git = "https://github.com/mcbegamerxx954/bhook" }
bstr = "1.12.0"
ctor = "0.4.1"
cxx = "1.0.128"
libc = "0.2.159"
log = "0.4.22"
ndk-sys = "0.6.0"
plt-rs = "0.4.0"
region = "3.0.2"
rustc-hash = "2"
tinypatscan = { git = "https://github.com/mcbegamerxx954/tinypatscan", version = "0.1.1" }

[profile.release]
# This lib is called from nowhere — unwinding into abort is the only safe option
panic = "abort"
opt-level = 3        # speed over size — LTO + single CGU already handles dead-code elimination
lto = true           # link-time optimization strips dead code across all crates
codegen-units = 1    # single codegen unit = best inlining across the whole crate graph
strip = true         # strip symbols from the final .so

[profile.githubci]
inherits = "release"
debug = false

[lib]
crate-type = ["cdylib"]

[build-dependencies]
cc = "1.1.24"

[lints.clippy]
indexing_slicing = "deny"
unwrap_used = "deny"
